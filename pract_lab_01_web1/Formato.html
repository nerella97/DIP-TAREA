<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato</title>
    <link rel="stylesheet" href="estilo_form.css">
</head>
<body>
    <header>
       <h1>iDESWEB</h1>    
       <h2>Formulario de registro</h2>  
    </header>
    <main>
       <form action="">
            <fieldset>
                <legend class="titulo-caja" >¿QUIÉN ERES?</legend>
                <div class="style-caja">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" style="background-color: red;">
                </div>
                <div class="style-caja">
                    <label for="apellido">Apellido</label>
                    <input type="text" name="apellido">
                </div>
                <div class="style-caja">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="email">
                </div>
                <div class="style-caja">
                    <label for="f.nac">Fecha de nacimiento</label>
                    <select name="dia">
                        <option selected>Día</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>
                    <select name="mes">
                        <option value="" selected>Mes</option>
                        <option value="1">Ene</option>
                        <option value="2">Feb</option>
                        <option value="3">Mar</option>
                        <option value="4">Abr</option>
                        <option value="5">May</option>
                        <option value="6">Jun</option>
                        <option value="7">Jul</option>
                        <option value="8">Ago</option>
                        <option value="9">Sep</option>
                        <option value="10">Oct</option>
                        <option value="11">Nov</option>
                        <option value="12">Dic</option>
                    </select>
                    <select name="año">
                        <option value="" selected>Año</option>
                        <option value="1990">1990</option>
                        <option value="1991">1991</option>
                        <option value="1992">1992</option>
                        <option value="1993">1993</option>
                        <option value="1994">1994</option>
                        <option value="1995">1995</option>
                        <option value="1996">1996</option>
                        <option value="1997">1997</option>
                        <option value="1998">1998</option>
                        <option value="1999">1999</option>
                        <option value="2000">2000</option> 
                    </select>
                </div>
            </fieldset> 
            <fieldset class="estructura">
                <legend class="titulo-caja">¿DE DÓNDE ERES?</legend>
                <div class="style-caja">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" name="ciudad">
                </div>
                <div class="style-caja">
                    <label for="codigo_p">Codigo postal</label>
                    <input type="number" name="codigo_p">
                </div>
                <div class="style-caja">
                    <label for="pais">Pais<label>
                    <select name="pais">
                        <option value="pais" selected>Pais</option>
                        <option value="pe">Perú</option>
                        <option value="ar">Argentina</option>
                        <option value="cl">Chile</option>
                        <option value="co">Colombia</option>
                        <option value="mx">México</option>
                    </select>
                </div>
            </fieldset> 
            <fieldset class="estructura">
                <legend class="titulo-caja">¿CÓMO QUIERES INICIAR SESIÓN?</legend>
                <div class="style-caja">
                    <label for="nom_usu">Nombre de usuario</label>
                    <input type="text" name="nom_usu">
                </div>
                <div class="style-caja">    
                    <label for="contraseña">Contraseña</label>
                    <input type="password" name="contraseña">
                </div>
                <div class="style-caja">
                    <label for="v.Contraseña">Vuelve a escribir la contraseña</label>
                    <input type="password">
                </div>
            </fieldset>   
            <fieldset class="estructura">
                <legend class="titulo-caja">CONDICIONES DE REGISTRO</legend>
                <label>Deseo recibir ofertas de iDESWEB</label>
                <input type="radio" name="oferta" id="dia">
                <label class="radio-texto" for="dia">
                    Una vez al día
                </label>                       
                <input type="radio" name="oferta" id="semana">
                <label class="radio-texto" for="semana">
                    Una vez a la semana
                </label>             
                <input type="radio" name="oferta" id="mes">
                <label class="radio-texto" for="mes">
                    Una vez al mes
                </label>  
                <br>  
                <br>               
                <input type="checkbox" id="condiciones">
                <label class="radio-texto" for="condiciones">
                    Acepto el acuerdo de servicios, la declaración de privacidad y la declaración de uso de cookies
                </label>
            </fieldset>           
       </form>
       <div class="boton">
            <input type="submit" value="Crear cuenta">
       </div>  
    </main>
</body>
</html>
